name: Daily News Update and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC: Singapore is UTC+8. GitHub scheduled starts can be delayed.
    - cron: '45 22 * * *'
    - cron: '45 4 * * *'
    - cron: '45 10 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: everyday-compass-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate latest Daily News
        run: python scripts/update_news.py
      - name: Save generated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Daily News"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/scripts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
