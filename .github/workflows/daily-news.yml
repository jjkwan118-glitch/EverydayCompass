name: Daily News Update and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC: Singapore is UTC+8. GitHub scheduled starts can be delayed.
    - cron: '45 22 * * *'
    - cron: '45 4 * * *'
    - cron: '45 10 * * *'
    # Backup checks 30 minutes later; skip if that refresh window already completed.
    - cron: '15 23 * * *'
    - cron: '15 5 * * *'
    - cron: '15 11 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: everyday-compass-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check whether backup refresh is needed
        id: refresh_check
        shell: python
        run: |
          import json, os
          from datetime import datetime, timezone, timedelta

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          scheduled = os.environ.get("GITHUB_EVENT_SCHEDULE", "")
          backup_crons = {"15 23 * * *", "15 5 * * *", "15 11 * * *"}

          needed = True
          if event == "schedule" and scheduled in backup_crons:
              sgt = timezone(timedelta(hours=8))
              now = datetime.now(sgt)
              targets = {
                  "15 23 * * *": now.replace(hour=6, minute=45, second=0, microsecond=0),
                  "15 5 * * *": now.replace(hour=12, minute=45, second=0, microsecond=0),
                  "15 11 * * *": now.replace(hour=18, minute=45, second=0, microsecond=0),
              }
              try:
                  with open("data/daily-news.json", encoding="utf-8") as fh:
                      generated = datetime.fromisoformat(json.load(fh)["generated_at"])
                  needed = generated < targets[scheduled]
              except Exception:
                  needed = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"needed={'true' if needed else 'false'}\n")

      - name: Generate latest Daily News
        if: steps.refresh_check.outputs.needed == 'true'
        run: python scripts/update_news.py
      - name: Save generated news
        if: steps.refresh_check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Daily News"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/scripts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
