name: Daily News Update and Deploy

on:
  workflow_dispatch:
  schedule:
    # UTC: Singapore is UTC+8. GitHub scheduled starts can be delayed.
    - cron: '45 22 * * *'
    - cron: '45 4 * * *'
    - cron: '45 10 * * *'
    # Backup 1 checks 2 hours later; Backup 2 checks 3 hours later.
    # Both skip if that refresh window already completed.
    - cron: '45 0 * * *'
    - cron: '45 6 * * *'
    - cron: '45 12 * * *'
    - cron: '45 1 * * *'
    - cron: '45 7 * * *'
    - cron: '45 13 * * *'

permissions:
  contents: write

concurrency:
  group: everyday-compass-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check whether backup refresh is needed
        id: refresh_check
        shell: python
        run: |
          import json, os
          from datetime import datetime, timezone, timedelta

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          scheduled = os.environ.get("GITHUB_EVENT_SCHEDULE", "")
          backup_crons = {"45 0 * * *", "45 6 * * *", "45 12 * * *",
                          "45 1 * * *", "45 7 * * *", "45 13 * * *"}

          needed = True
          if event == "schedule" and scheduled in backup_crons:
              sgt = timezone(timedelta(hours=8))
              now = datetime.now(sgt)
              targets = {
                  "45 0 * * *": now.replace(hour=6, minute=45, second=0, microsecond=0),
                  "45 6 * * *": now.replace(hour=12, minute=45, second=0, microsecond=0),
                  "45 12 * * *": now.replace(hour=18, minute=45, second=0, microsecond=0),
                  "45 1 * * *": now.replace(hour=6, minute=45, second=0, microsecond=0),
                  "45 7 * * *": now.replace(hour=12, minute=45, second=0, microsecond=0),
                  "45 13 * * *": now.replace(hour=18, minute=45, second=0, microsecond=0),
              }
              try:
                  with open("data/daily-news.json", encoding="utf-8") as fh:
                      generated = datetime.fromisoformat(json.load(fh)["generated_at"])
                  needed = generated < targets[scheduled]
              except Exception:
                  needed = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"needed={'true' if needed else 'false'}\n")

      - name: Generate latest Daily News
        if: steps.refresh_check.outputs.needed == 'true'
        run: python scripts/update_news.py
      - name: Save generated news
        if: steps.refresh_check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Daily News"
            git push origin HEAD:main
          fi
